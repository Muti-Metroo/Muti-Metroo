name: Documentation

on:
  push:
    branches:
      - master
    paths:
      - "docs/**"
      - "cmd/**"
      - "internal/**"
      - ".github/workflows/docs.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: docs/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      # Every command line, config example, and HTTP path in the docs must
      # match the agent built from this commit.
      - name: Verify documentation against the implementation
        run: node docs/scripts/verify-docs.mjs

      - name: Build documentation
        working-directory: docs
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
