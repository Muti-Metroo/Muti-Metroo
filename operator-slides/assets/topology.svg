<svg viewBox="0 0 880 380" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #000000; }
    .box { fill: #0a1408; stroke: #00ff41; stroke-width: 2; }
    .box-shared { fill: #0f1d0d; stroke: #ffb000; stroke-width: 2.5; }
    .box-mesh { fill: #0a1408; stroke: #00d4ff; stroke-width: 2; }
    .label { fill: #33ff66; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 16px; }
    .label-strong { fill: #00ff41; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 17px; font-weight: bold; }
    .label-amber { fill: #ffb000; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 17px; font-weight: bold; }
    .label-cyan { fill: #00d4ff; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 16px; }
    .heading { fill: #1f9e3a; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 14px; letter-spacing: 2px; }
    .arrow { stroke: #1f9e3a; stroke-width: 1.5; fill: none; }
    .arrow-strong { stroke: #ffb000; stroke-width: 1.8; fill: none; }
    .footnote { fill: #33ff66; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 14px; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f9e3a"/>
    </marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffb000"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="380" class="bg"/>

  <text x="100" y="22" class="heading">OPERATOR WORKSTATIONS</text>
  <rect x="40" y="40" width="180" height="60" rx="6" class="box"/>
  <text x="60" y="65" class="label-strong">Linux laptop</text>
  <text x="60" y="86" class="label">mutiauk (TUN)</text>
  <rect x="40" y="120" width="180" height="60" rx="6" class="box"/>
  <text x="60" y="145" class="label-strong">Linux laptop</text>
  <text x="60" y="166" class="label">mutiauk (TUN)</text>
  <rect x="40" y="200" width="180" height="60" rx="6" class="box"/>
  <text x="60" y="225" class="label-strong">Linux laptop</text>
  <text x="60" y="246" class="label">mutiauk (TUN)</text>

  <text x="380" y="22" class="heading">SHARED HOST</text>
  <rect x="320" y="40" width="220" height="220" rx="8" class="box-shared"/>
  <text x="340" y="80" class="label-amber">muti-metroo</text>
  <text x="340" y="100" class="label">SOCKS5 / SOCKS4</text>
  <text x="340" y="120" class="label">QUIC / WS</text>
  <text x="340" y="140" class="label">HTTP API</text>
  <line x1="340" y1="160" x2="520" y2="160" stroke="#1f5a2a" stroke-width="1"/>
  <text x="340" y="185" class="label-amber">muti-metroo-manager</text>
  <text x="340" y="205" class="label">browser dashboard</text>
  <text x="340" y="225" class="label">downloads bundle</text>

  <text x="660" y="22" class="heading">MESH</text>
  <rect x="640" y="40" width="200" height="60" rx="6" class="box-mesh"/>
  <text x="660" y="65" class="label-cyan">peer agent</text>
  <text x="660" y="86" class="label">exit for site A</text>
  <rect x="640" y="120" width="200" height="60" rx="6" class="box-mesh"/>
  <text x="660" y="145" class="label-cyan">peer agent</text>
  <text x="660" y="166" class="label">transit hub</text>
  <rect x="640" y="200" width="200" height="60" rx="6" class="box-mesh"/>
  <text x="660" y="225" class="label-cyan">peer agent</text>
  <text x="660" y="246" class="label">exit for site B</text>

  <path d="M 220 70 Q 270 90 320 90" class="arrow-strong" marker-end="url(#ah-amber)"/>
  <path d="M 220 150 Q 270 150 320 150" class="arrow-strong" marker-end="url(#ah-amber)"/>
  <path d="M 220 230 Q 270 210 320 210" class="arrow-strong" marker-end="url(#ah-amber)"/>

  <path d="M 540 90 Q 590 80 640 70" class="arrow" marker-end="url(#ah)"/>
  <path d="M 540 150 L 640 150" class="arrow" marker-end="url(#ah)"/>
  <path d="M 540 210 Q 590 220 640 230" class="arrow" marker-end="url(#ah)"/>

  <text x="240" y="320" class="footnote">Operators talk to the shared host. The shared host is the only mesh participant on your team's side.</text>
</svg>
